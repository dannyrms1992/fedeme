<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#CBD5E1" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid-major" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#grid)"/>
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#94A3B8" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fondo base -->
  <rect width="1920" height="1080" fill="#1E293B"/>

  <!-- Grid -->
  <rect width="1920" height="1080" fill="url(#grid-major)" opacity="0.4"/>

  <!-- Regla de tercios — líneas verticales -->
  <line x1="640" y1="0" x2="640" y2="1080" stroke="#475569" stroke-width="1" stroke-dasharray="8,8"/>
  <line x1="1280" y1="0" x2="1280" y2="1080" stroke="#475569" stroke-width="1" stroke-dasharray="8,8"/>

  <!-- Regla de tercios — líneas horizontales -->
  <line x1="0" y1="360" x2="1920" y2="360" stroke="#475569" stroke-width="1" stroke-dasharray="8,8"/>
  <line x1="0" y1="720" x2="1920" y2="720" stroke="#475569" stroke-width="1" stroke-dasharray="8,8"/>

  <!-- ============================================================ -->
  <!-- ZONA SEGURA MOBIL (400px) — centrada verticalmente: y=340..740 -->
  <!-- ============================================================ -->
  <rect x="0" y="340" width="1920" height="400"
        fill="none" stroke="#F97316" stroke-width="3" stroke-dasharray="16,8" opacity="0.8"/>
  <!-- Relleno sutil -->
  <rect x="0" y="340" width="1920" height="400" fill="#F97316" opacity="0.04"/>

  <!-- ============================================================ -->
  <!-- ZONA SEGURA TABLET (500px) — centrada: y=290..790 -->
  <!-- ============================================================ -->
  <rect x="0" y="290" width="1920" height="500"
        fill="none" stroke="#FACC15" stroke-width="3" stroke-dasharray="16,8" opacity="0.8"/>
  <rect x="0" y="290" width="1920" height="500" fill="#FACC15" opacity="0.03"/>

  <!-- ============================================================ -->
  <!-- ZONA SEGURA DESKTOP (580px) — centrada: y=250..830 -->
  <!-- ============================================================ -->
  <rect x="0" y="250" width="1920" height="580"
        fill="none" stroke="#34D399" stroke-width="3" stroke-dasharray="16,8" opacity="0.8"/>
  <rect x="0" y="250" width="1920" height="580" fill="#34D399" opacity="0.04"/>

  <!-- ============================================================ -->
  <!-- ÁREAS RECORTADAS (fuera de zona desktop) — oscurecer -->
  <!-- ============================================================ -->
  <rect x="0" y="0" width="1920" height="250" fill="#0F172A" opacity="0.6"/>
  <rect x="0" y="830" width="1920" height="250" fill="#0F172A" opacity="0.6"/>

  <!-- TEXTO: zona recortada superior -->
  <text x="960" y="130" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="28" font-weight="bold">
    ⚠ ZONA RECORTADA — No colocar elementos importantes aquí
  </text>
  <text x="960" y="170" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="20">
    (visible solo en pantallas muy altas)
  </text>

  <!-- TEXTO: zona recortada inferior -->
  <text x="960" y="935" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="28" font-weight="bold">
    ⚠ ZONA RECORTADA — No colocar elementos importantes aquí
  </text>

  <!-- ============================================================ -->
  <!-- ETIQUETAS DE ZONAS SEGURAS -->
  <!-- ============================================================ -->

  <!-- Label Desktop -->
  <rect x="20" y="253" width="340" height="44" rx="8" fill="#34D399" opacity="0.9"/>
  <text x="190" y="281" text-anchor="middle" fill="#064E3B" font-family="Arial, sans-serif" font-size="22" font-weight="bold">
    DESKTOP lg — 580px visible
  </text>

  <!-- Label Tablet -->
  <rect x="20" y="293" width="310" height="40" rx="8" fill="#FACC15" opacity="0.9"/>
  <text x="175" y="319" text-anchor="middle" fill="#713F12" font-family="Arial, sans-serif" font-size="20" font-weight="bold">
    TABLET md — 500px visible
  </text>

  <!-- Label Móvil -->
  <rect x="20" y="343" width="280" height="38" rx="8" fill="#F97316" opacity="0.9"/>
  <text x="160" y="367" text-anchor="middle" fill="#431407" font-family="Arial, sans-serif" font-size="20" font-weight="bold">
    MÓVIL sm — 400px visible
  </text>

  <!-- Labels bordes inferiores -->
  <rect x="20" y="752" width="280" height="38" rx="8" fill="#F97316" opacity="0.9"/>
  <text x="160" y="776" text-anchor="middle" fill="#431407" font-family="Arial, sans-serif" font-size="20" font-weight="bold">
    MÓVIL — límite inferior
  </text>

  <rect x="20" y="793" width="310" height="38" rx="8" fill="#FACC15" opacity="0.9"/>
  <text x="175" y="817" text-anchor="middle" fill="#713F12" font-family="Arial, sans-serif" font-size="20" font-weight="bold">
    TABLET — límite inferior
  </text>

  <rect x="20" y="834" width="340" height="38" rx="8" fill="#34D399" opacity="0.9"/>
  <text x="190" y="858" text-anchor="middle" fill="#064E3B" font-family="Arial, sans-serif" font-size="22" font-weight="bold">
    DESKTOP — límite inferior
  </text>

  <!-- ============================================================ -->
  <!-- CENTRO — CROSSHAIR -->
  <!-- ============================================================ -->
  <circle cx="960" cy="540" r="60" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
  <circle cx="960" cy="540" r="8" fill="#FFFFFF" opacity="0.5"/>
  <line x1="900" y1="540" x2="1020" y2="540" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
  <line x1="960" y1="480" x2="960" y2="600" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>

  <!-- TEXTO CENTRAL -->
  <text x="960" y="490" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" font-weight="bold" opacity="0.7">
    ZONA SEGURA UNIVERSAL
  </text>
  <text x="960" y="535" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="24" opacity="0.8">
    Coloca el sujeto principal aquí
  </text>
  <text x="960" y="575" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="20" opacity="0.9">
    Visible en TODOS los dispositivos
  </text>

  <!-- ============================================================ -->
  <!-- DIMENSIONES TOTALES -->
  <!-- ============================================================ -->
  <!-- Cota horizontal superior -->
  <line x1="0" y1="14" x2="1920" y2="14" stroke="#60A5FA" stroke-width="2"/>
  <line x1="0" y1="8" x2="0" y2="20" stroke="#60A5FA" stroke-width="2"/>
  <line x1="1920" y1="8" x2="1920" y2="20" stroke="#60A5FA" stroke-width="2"/>
  <rect x="810" y="4" width="300" height="28" rx="6" fill="#1E40AF"/>
  <text x="960" y="23" text-anchor="middle" fill="#BFDBFE" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    1920 px (ancho total)
  </text>

  <!-- Cota vertical derecha -->
  <line x1="1906" y1="0" x2="1906" y2="1080" stroke="#60A5FA" stroke-width="2"/>
  <line x1="1900" y1="0" x2="1912" y2="0" stroke="#60A5FA" stroke-width="2"/>
  <line x1="1900" y1="1080" x2="1912" y2="1080" stroke="#60A5FA" stroke-width="2"/>
  <rect x="1860" y="516" width="56" height="48" rx="6" fill="#1E40AF" transform="rotate(-90, 1888, 540)"/>
  <text x="1888" y="544" text-anchor="middle" fill="#BFDBFE" font-family="Arial, sans-serif" font-size="16" font-weight="bold" transform="rotate(-90, 1888, 540)">
    1080 px
  </text>

  <!-- ============================================================ -->
  <!-- LEYENDA INFERIOR -->
  <!-- ============================================================ -->
  <rect x="0" y="1040" width="1920" height="40" fill="#0F172A" opacity="0.85"/>

  <!-- Leyenda desktop -->
  <rect x="40" y="1050" width="24" height="24" rx="4" fill="none" stroke="#34D399" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="72" y="1067" fill="#34D399" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Desktop (lg) — 1920×580px</text>

  <!-- Leyenda tablet -->
  <rect x="420" y="1050" width="24" height="24" rx="4" fill="none" stroke="#FACC15" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="452" y="1067" fill="#FACC15" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Tablet (md) — 1920×500px</text>

  <!-- Leyenda móvil -->
  <rect x="800" y="1050" width="24" height="24" rx="4" fill="none" stroke="#F97316" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="832" y="1067" fill="#F97316" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Móvil (sm) — 1920×400px</text>

  <!-- Leyenda crosshair -->
  <circle cx="1196" cy="1062" r="8" fill="#FFFFFF" opacity="0.4"/>
  <text x="1212" y="1067" fill="#94A3B8" font-family="Arial, sans-serif" font-size="18">Centro visual recomendado</text>

  <!-- Leyenda tercios -->
  <line x1="1540" y1="1050" x2="1564" y2="1050" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="1540" y1="1074" x2="1564" y2="1074" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="1540" y1="1050" x2="1540" y2="1074" stroke="#475569" stroke-width="1.5"/>
  <line x1="1564" y1="1050" x2="1564" y2="1074" stroke="#475569" stroke-width="1.5"/>
  <text x="1576" y="1067" fill="#64748B" font-family="Arial, sans-serif" font-size="18">Regla de tercios</text>

  <!-- TÍTULO PLANTILLA -->
  <rect x="1540" y="20" width="360" height="60" rx="10" fill="#0F172A" opacity="0.8"/>
  <text x="1720" y="48" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="bold">FEDEME — Plantilla Carrusel</text>
  <text x="1720" y="71" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="14">Formato recomendado: 1920×1080 px</text>
</svg>
